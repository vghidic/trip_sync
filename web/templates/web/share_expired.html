{% extends "web/join_base.html" %}

{% block title %}Link no longer active &middot; Trip Sync{% endblock %}

{% block content %}
  <div class="join join--dead">
    <div class="join__panel">
      <p class="eyebrow eyebrow--muted">Shared itinerary</p>
      <h1 class="join__title">{{ expired.title }}</h1>
      <p class="join__lede">{{ expired.lede }}</p>

      <p class="join__terms">
        Nothing was shared with you by this link. A revoked link shows no
        plans, no costs and nobody&rsquo;s details.
      </p>
    </div>
  </div>
{% endblock %}
