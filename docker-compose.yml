services:
  db:
    image: postgres:17-alpine
    container_name: trip-sync-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trip_sync}
      POSTGRES_USER: ${POSTGRES_USER:-trip_sync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trip_sync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trip_sync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trip_sync} -d ${POSTGRES_DB:-trip_sync}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trip_sync_postgres_data:
    name: trip_sync_postgres_data
